[theme]
base = "light"
primaryColor = "#2e7d32"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f3"
textColor = "#1a1a1a"
linkColor = "#1f5fa8"
borderColor = "#d9ded9"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 17
baseFontWeight = 400
headingFontSizes = ["2.1rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
baseRadius = "medium"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#eef2ee"
chartCategoricalColors = ["#2e7d32", "#1f5fa8", "#e65100", "#6a1b9a", "#00796b", "#b58900"]
